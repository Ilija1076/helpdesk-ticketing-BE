name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk
          POSTGRES_DB: helpdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://helpdesk:helpdesk@localhost:5432/helpdesk_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-secret-long-enough-for-joi
      BUSINESS_TIMEZONE: Europe/Belgrade

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm run build

      - run: npm test

      - run: npx prisma migrate deploy

      - name: Check openapi.json is up to date
        run: |
          npm run openapi
          git diff --exit-code openapi.json \
            || (echo "::error::openapi.json is stale. Run 'npm run openapi' and commit the result." && exit 1)

      - run: npm run test:e2e

  docker:
    name: Build image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Prometheus config
        run: |
          docker run --rm -v "$PWD/docker/prometheus:/cfg:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 check config /cfg/prometheus.yml

      - name: Validate Grafana dashboard JSON
        run: node -e "JSON.parse(require('fs').readFileSync('docker/grafana/dashboards/helpdesk.json','utf8'))"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
